---
layout: default
---
<a href="{{ '/blog/' | relative_url }}" class="back-link">&larr; back to blog</a>

<h1>{{ page.title }}</h1>
<div class="post-meta">
    {{ page.date | date: "%B %-d, %Y" }}
    {% if page.tags.size > 0 %}
        &middot; {{ page.tags | join: ", " }}
    {% endif %}
</div>

<div class="post-content">
    {{ content }}
</div>

<p style="margin-top:50px;"><a href="{{ '/blog/' | relative_url }}">&larr; back to blog</a></p>
