---
layout: default
---
<a href="{{ '/blog/' | relative_url }}" class="back-link">&larr; back to blog</a>

<h1>{{ page.title }}</h1>

{% if page.tags.size > 0 %}
<div class="post-page-tags">
    {% for tag in page.tags %}<span class="tag-pill tag-color-{{ tag | size | modulo: 5 }}">{{ tag }}</span>{% endfor %}
</div>
{% endif %}

<div class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</div>

<div class="post-content">
    {{ content }}
</div>

<p style="margin-top:50px;"><a href="{{ '/blog/' | relative_url }}">&larr; back to blog</a></p>
