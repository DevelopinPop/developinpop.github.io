<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% feed_meta %}
    {% if page.mathjax %}
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']]
            }
        };
    </script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
    {% endif %}
</head>
<body>

<div class="bg-layers" aria-hidden="true">
    <div class="glow glow-teal"></div>
    <div class="glow glow-violet"></div>
    <div class="glow glow-indigo"></div>
</div>

{% include navbar.html %}

<div class="wrap">
    {{ content }}

    <footer class="site-footer">
        © {{ site.author }} {{ 'now' | date: "%Y" }}. All rights reserved.
    </footer>
</div>

<script src="{{ '/assets/js/code-blocks.js' | relative_url }}"></script>
<script src="{{ '/assets/js/bg-parallax.js' | relative_url }}"></script>
</body>
</html>
