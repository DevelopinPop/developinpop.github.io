title: DevelopinPop
tagline: welcome to my silly website!
description: >-
  DevelopinPop's personal site — a blog and a way to get in touch.
author: DevelopinPop
email: you@example.com

# Change baseurl to "/REPO_NAME" if this is NOT a <username>.github.io repo,
# e.g. baseurl: "/my-cool-site". Leave as "" for a <username>.github.io repo.
baseurl: ""
url: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax

permalink: /blog/:slug/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"
      mathjax: true

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
